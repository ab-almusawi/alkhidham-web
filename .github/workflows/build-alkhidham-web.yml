name: Build Push Al Khidham Web

env:
  DOCKER_IMAGE_NAME: ab-almusawi/alkhidham-web
  SERVICE_FOLDER: .
  DOCKERFILE_NAME: Dockerfile
  DOCKER_REGISTRY_URL: ghcr.io

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'app/**'
      - 'public/**'
      - 'i18n/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'nuxt.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tailwind.config.ts'
      - '.github/workflows/build-alkhidham-web.yml'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (dev or release)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - release
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: string

jobs:
  build_push_image:
    name: Build Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set tag and URLs
        run: |
          cd $SERVICE_FOLDER
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.tag }}" == "release" ]]; then
              echo "TAG_NAME=release" >> $GITHUB_ENV
              echo "NUXT_PUBLIC_SITE_URL=https://clinora.site" >> $GITHUB_ENV
              if [ -f .env.prod ]; then cat .env.prod >> .env; fi
            else
              echo "TAG_NAME=dev" >> $GITHUB_ENV
              echo "NUXT_PUBLIC_SITE_URL=https://clinora.site" >> $GITHUB_ENV
              if [ -f .env.dev ]; then cat .env.dev >> .env; fi
            fi
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "TAG_NAME=release" >> $GITHUB_ENV
            echo "NUXT_PUBLIC_SITE_URL=https://clinora.site" >> $GITHUB_ENV
            if [ -f .env.prod ]; then cat .env.prod >> .env; fi
          else
            echo "TAG_NAME=dev" >> $GITHUB_ENV
            echo "NUXT_PUBLIC_SITE_URL=https://clinora.site" >> $GITHUB_ENV
            if [ -f .env.dev ]; then cat .env.dev >> .env; fi
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ab-almusawi
          password: ${{ secrets.CR_PAT }}

      - name: Build the Docker image
        run: |
          cd $SERVICE_FOLDER
          docker build --no-cache \
            -f $DOCKERFILE_NAME \
            --build-arg NUXT_PUBLIC_SITE_URL=$NUXT_PUBLIC_SITE_URL \
            --label "org.opencontainers.image.source=https://github.com/ab-almusawi/alkhidham-web" \
            --label "org.opencontainers.image.description=Al Khidham travel website" \
            --label "org.opencontainers.image.licenses=UNLICENSED" \
            -t $DOCKER_REGISTRY_URL/$DOCKER_IMAGE_NAME:$TAG_NAME .

      - name: Push the image
        run: docker push $DOCKER_REGISTRY_URL/$DOCKER_IMAGE_NAME:$TAG_NAME
